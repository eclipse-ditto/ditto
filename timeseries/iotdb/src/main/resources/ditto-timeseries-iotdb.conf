# Switches the timeseries service to the Apache IoTDB 2.x adapter (table model): add
#   include required(classpath("ditto-timeseries-iotdb.conf"))
# to /opt/ditto/timeseries-extension.conf and put the ditto-timeseries-iotdb extension JAR into /opt/ditto/extensions.
ditto {
  extensions.timeseries-adapter = "org.eclipse.ditto.timeseries.iotdb.IoTDbTimeseriesAdapter"

  # One table per Thing namespace in `database`, which is created on start-up if absent.
  timeseries.adapter.iotdb {
    host = "localhost"
    host = ${?TIMESERIES_IOTDB_HOST}
    port = 6667
    port = ${?TIMESERIES_IOTDB_PORT}
    username = "root"
    username = ${?TIMESERIES_IOTDB_USERNAME}
    password = "root"
    password = ${?TIMESERIES_IOTDB_PASSWORD}
    database = "ditto_ts"
    database = ${?TIMESERIES_IOTDB_DATABASE}

    table-prefix = "ts_"

    # Size of the session pool, and of the thread pool blocking on it.
    max-sessions = 16
    max-sessions = ${?TIMESERIES_IOTDB_MAX_SESSIONS}

    # Default retention, applied as the TTL of each namespace table; "unlimited" disables it. Reconciled onto
    # existing tables on the first write to them after a restart.
    retention = 90d
    retention = ${?TIMESERIES_IOTDB_RETENTION}
    retention-overrides {
      # "com.acme.hifreq" = 7d
    }

    # Ceiling on the data points read into memory per path; exceeding it on an aggregation is a 400.
    max-query-result-size = 1000000
    max-query-result-size = ${?TIMESERIES_IOTDB_MAX_QUERY_RESULT_SIZE}

    # Time budget per IoTDB statement.
    query-timeout = 60s
    query-timeout = ${?TIMESERIES_IOTDB_QUERY_TIMEOUT}
  }
}
