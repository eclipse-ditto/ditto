# ---------------------------------------------------------------------------------------------------------------------
# Ditto PostgreSQL persistence PROFILE.
#
# This file is the OPT-IN Postgres counterpart to the Mongo persistence HOCON each service ships inline
# (see e.g. things.conf `pekko-contrib-mongodb-persistence-*` blocks). MongoDB stays the DEFAULT backend
# (reference.conf in internal/utils/persistence selects MongoPersistenceBackendProvider); a deployment that
# wants Postgres opts in by INCLUDING this SINGLE file from the service config: the provider selection, the
# per-entity Pekko plugin blocks, the (all-4-entity default) auto-start lists, AND the `ditto.postgresql.*`
# client/pool/SSL defaults are all defined here.
#
# One thing this single include does NOT do for you: each Ditto service process only defines dispatchers for
# its OWN entity type, so a single-entity service deployment MUST ALSO narrow the `pekko.persistence`
# auto-start lists below to that one entity (see the auto-start block comment further down and each service's
# *-pg-dev.conf) — leaving the all-4-entity default in place makes Pekko resolve a missing dispatcher for the
# other three entities and crash the first persistent actor. This file wires everything else; narrowing the
# auto-start lists is the one step every single-entity deployment still owns.
#
# How to select the Postgres profile in a service (top-level `include classpath(...)`; see the CLASSPATH note
# in each service's *-pg-dev.conf for why it must be top-level, not nested in `ditto { }`):
#
#     include classpath("ditto-postgres-persistence")   # provider + Pekko plugin wiring + client defaults
#
# Because the include is explicit, NOT including it leaves the Mongo default completely undisturbed.
#
# The `class =` of every plugin block points at the Postgres journal, snapshot-store, and read-journal plugin
# classes. The `ditto.postgresql.*` client config the blocks rely on (uri, pool, ssl, ...) is read by
# DittoPostgresClient and lives at the BOTTOM of this file. All client params are tuned via POSTGRES_* env
# vars at runtime; nothing is hard-coded per deployment.
#
# SNAPSHOT ADAPTER — nothing to override. The snapshot envelope is no longer selected per backend. Each service
# keeps its `ditto.extensions.snapshot-adapter` (unchanged key and MongoDB default), which now selects only the
# backend-neutral domain<->JsonObject serializer; AbstractPersistenceActor composes it with the active backend's
# snapshot codec resolved from the `persistence-backend-provider` below (Mongo = BSON, Postgres = JSONB). Switching
# this profile in therefore switches the snapshot envelope automatically — no per-service snapshot change is required.
# ---------------------------------------------------------------------------------------------------------------------

ditto {
  extensions {
    # Swap the persistence backend provider from Mongo (the reference.conf default) to Postgres.
    # The provider resolves the `ditto-postgres-<entity>-*` plugin IDs below per entity type and the shared
    # PostgresReadJournal. NO pluralize() heuristic — every entity declares an explicit plugin-id mapping.
    persistence-backend-provider = {
      extension-class = "org.eclipse.ditto.internal.utils.persistence.postgres.PostgresPersistenceBackendProvider"
      extension-config {
        plugin-ids {
          thing.journal                 = "ditto-postgres-things-journal"
          thing.snapshot                = "ditto-postgres-things-snapshots"
          policy.journal                = "ditto-postgres-policies-journal"
          policy.snapshot               = "ditto-postgres-policies-snapshots"
          connection.journal            = "ditto-postgres-connections-journal"
          connection.snapshot           = "ditto-postgres-connections-snapshots"
          wot-validation-config.journal  = "ditto-postgres-wot-journal"
          wot-validation-config.snapshot = "ditto-postgres-wot-snapshots"
        }
        # A service persists a single entity type per actor system, so the shared read journal binds to one
        # table set. This is intentionally REQUIRED with NO default: a silent "things" default would point a
        # policies/connectivity read journal at the things_* tables and return the wrong rows. Each consuming
        # service sets it explicitly to its own entity (things.conf="things", policies.conf="policies",
        # connectivity.conf="connections"). A missing value fails boot fast with a DittoConfigError. The env
        # override below lets an operator pin it without editing a service config; when unset the substitution
        # resolves away and the per-service value (or the boot-time failure) stands.
        read-journal.entity = ${?POSTGRES_READ_JOURNAL_ENTITY}
      }
    }

    # ---------------------------------------------------------------------------------------------------------
    # Snapshot adapter — NO override needed.
    #
    # The per-backend snapshot-adapter pair was collapsed into one neutral selection: each service keeps its
    # `ditto.extensions.snapshot-adapter` (unchanged key and MongoDB default), which now selects only the
    # backend-neutral serializer, and AbstractPersistenceActor composes it with the snapshot codec of the
    # `persistence-backend-provider` above. Selecting the Postgres provider here therefore selects the JSONB
    # snapshot envelope automatically. There is nothing for an operator to override here.
    # ---------------------------------------------------------------------------------------------------------
  }

}

# ---------------------------------------------------------------------------------------------------------------------
# Pekko wiring the single include owns — WITH the one narrowing step every single-entity deployment still owns
# (see the header note above).
#
# Auto-start: Pekko reads pekko.persistence.* (NOT ditto.persistence.*). The service configs hardwire the
# Mongo plugins there; this profile is included AFTER the service config (later include wins), so these lists
# replace the Mongo ones. The full 4-entity default is only bootable where all four per-entity plugin
# dispatchers are defined (an all-in-one config). Each Ditto service defines ONLY its own entity's dispatchers,
# so a service deployment MUST narrow these lists to its own entity (see *-pg-dev.conf) — Pekko resolves every
# auto-started plugin's plugin-dispatcher eagerly at Persistence-extension init and crashes the first
# persistent actor on a missing dispatcher.
# ---------------------------------------------------------------------------------------------------------------------
pekko.persistence {
  journal.auto-start-journals = [
    "ditto-postgres-things-journal",
    "ditto-postgres-policies-journal",
    "ditto-postgres-connections-journal",
    "ditto-postgres-wot-journal"
  ]
  snapshot-store.auto-start-snapshot-stores = [
    "ditto-postgres-things-snapshots",
    "ditto-postgres-policies-snapshots",
    "ditto-postgres-connections-snapshots",
    "ditto-postgres-wot-snapshots"
  ]
}

# Remember-entities: connectivity's default eventsourced store would persist Pekko-internal remember-entities
# events through a journal whose adapter bindings cannot encode them. The ddata store needs no journal at all;
# inert for things/policies (they do not enable remember-entities).
pekko.cluster.sharding.remember-entities-store = "ddata"

# ---------------------------------------------------------------------------------------------------------------------
# Per-entity Pekko persistence plugin blocks.
#
# Each entity gets two blocks mirroring the Mongo layout:
#   ditto-postgres-<entity>-journal       -> the AsyncWriteJournal (PostgresJournal)
#   ditto-postgres-<entity>-snapshots     -> the SnapshotStore     (PostgresSnapshotStore)
#
# The journal/snapshot blocks reuse the same per-entity persistence dispatchers the Mongo plugins use, so a
# deployment swapping backends keeps its dispatcher tuning.
#
# Every block also declares the MongoDB plugins' Pekko circuit breaker (same values, same BREAKER_* /
# SNAPSHOT_BREAKER_* environment variables), so one set of breaker settings serves either backend.
# ---------------------------------------------------------------------------------------------------------------------

# ===== things =====

ditto-postgres-things-journal {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.journal.PostgresJournal"
  plugin-dispatcher = "thing-journal-persistence-dispatcher"
  entity = "things"

  # Pekko circuit breaker with the MongoDB journal plugins' values and environment variables (things.conf
  # `pekko-contrib-mongodb-persistence-things-journal`). Without it the plugin inherits Pekko's
  # journal-plugin-fallback (10 failures / 10s / 30s). Rejected pool borrows and acquire timeouts count as failures.
  circuit-breaker {
    max-failures = 5
    max-failures = ${?BREAKER_MAXTRIES}
    call-timeout = 5s
    call-timeout = ${?BREAKER_TIMEOUT}
    reset-timeout = 3s
    reset-timeout = ${?BREAKER_RESET}
  }

  # JSONB event adapter (peer of the Mongo `mongodbobject` binding in things.conf:626-635). WoT-validation-config
  # events do NOT share this journal: they use their own `ditto-postgres-wot-journal` block (plugin-id
  # `wot-validation-config.journal`), exactly as Mongo routes them to the separate
  # `pekko-contrib-mongodb-persistence-wot-validation-config-journal`. So this block routes a SINGLE event type and a
  # single replay-payload binding is unambiguous.
  #
  # Two bindings are required, mirroring the two Mongo bindings (`ThingEvent` and `org.bson.BsonValue`):
  #   * WRITE side: `ThingEvent` -> the adapter, so a persisted domain event is encoded to JSONB text (a raw event is
  #     not JSONB-bindable and the write would fail).
  #   * READ side: `java.lang.String` -> the adapter. Pekko's WriteJournalBase.adaptFromJournal resolves the read
  #     adapter by `repr.payload().getClass()`, and PostgresJournalOps.toRepr builds the PersistentRepr with a
  #     java.lang.String payload (JournalRow.eventJson is the JSONB column rendered as text). Without this binding
  #     EventAdapters.get(String.class) falls back to Pekko's IdentityEventAdapter, the actor receives a bare String
  #     its match(getEventClass()) never matches, and every event is silently dropped on recovery. This is the
  #     Postgres peer of the Mongo `"org.bson.BsonValue" = mongodbobject` binding (the Mongo journal replays a
  #     BsonValue payload; the Postgres journal replays a String).
  event-adapters {
    postgresjsonb = "org.eclipse.ditto.things.service.persistence.serializer.ThingPostgresEventAdapter"
  }

  event-adapter-bindings {
    # Fallback for internal events implementing only the base Event interface (e.g. EmptyEvent used by
    # the always-alive/priority journal-tag path) — Mongo parity with connectivity.conf's base binding.
    "org.eclipse.ditto.base.model.signals.events.Event" = postgresjsonb
    "org.eclipse.ditto.things.model.signals.events.ThingEvent" = postgresjsonb
    "java.lang.String" = postgresjsonb
  }
}

ditto-postgres-things-snapshots {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.snapshot.PostgresSnapshotStore"
  plugin-dispatcher = "thing-snaps-persistence-dispatcher"
  entity = "things"

  # Pekko circuit breaker with the MongoDB snapshot plugins' values and environment variables (things.conf
  # `pekko-contrib-mongodb-persistence-things-snapshots`). Without it the plugin inherits Pekko's
  # snapshot-store-plugin-fallback (5 failures / 20s / 60s). Every recovery starts with a snapshot load, so under a
  # pool overload rejected recovery borrows open this breaker first; while it is open, every recovery of the service
  # fails at once, for the 60s fallback reset that was a minute.
  circuit-breaker {
    max-failures = 5
    max-failures = ${?SNAPSHOT_BREAKER_MAXTRIES}
    call-timeout = 10s
    call-timeout = ${?SNAPSHOT_BREAKER_TIMEOUT}
    reset-timeout = 6s
    reset-timeout = ${?SNAPSHOT_BREAKER_RESET}
  }
}

# ===== policies =====

ditto-postgres-policies-journal {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.journal.PostgresJournal"
  plugin-dispatcher = "policy-journal-persistence-dispatcher"
  entity = "policies"

  # Pekko circuit breaker: as ditto-postgres-things-journal (MongoDB journal values, BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?BREAKER_MAXTRIES}
    call-timeout = 5s
    call-timeout = ${?BREAKER_TIMEOUT}
    reset-timeout = 3s
    reset-timeout = ${?BREAKER_RESET}
  }

  # JSONB event adapter (peer of the Mongo DefaultPolicyMongoEventAdapter binding). The `java.lang.String` binding is
  # the read/replay-side peer of the Mongo `"org.bson.BsonValue" = mongodbobject` binding: PostgresJournalOps.toRepr
  # replays a java.lang.String payload, and without this binding EventAdapters.get(String.class) falls back to
  # IdentityEventAdapter and every event is silently dropped on recovery.
  event-adapters {
    postgresjsonb = "org.eclipse.ditto.policies.service.persistence.serializer.PolicyPostgresEventAdapter"
  }

  event-adapter-bindings {
    # Fallback for internal events implementing only the base Event interface (e.g. EmptyEvent used by
    # the always-alive/priority journal-tag path) — Mongo parity with connectivity.conf's base binding.
    "org.eclipse.ditto.base.model.signals.events.Event" = postgresjsonb
    "org.eclipse.ditto.policies.model.signals.events.PolicyEvent" = postgresjsonb
    "java.lang.String" = postgresjsonb
  }
}

ditto-postgres-policies-snapshots {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.snapshot.PostgresSnapshotStore"
  plugin-dispatcher = "policy-snaps-persistence-dispatcher"
  entity = "policies"

  # Pekko circuit breaker: as ditto-postgres-things-snapshots (MongoDB snapshot values, SNAPSHOT_BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?SNAPSHOT_BREAKER_MAXTRIES}
    call-timeout = 10s
    call-timeout = ${?SNAPSHOT_BREAKER_TIMEOUT}
    reset-timeout = 6s
    reset-timeout = ${?SNAPSHOT_BREAKER_RESET}
  }
}

# ===== connections =====

ditto-postgres-connections-journal {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.journal.PostgresJournal"
  plugin-dispatcher = "connection-persistence-dispatcher"
  entity = "connections"

  # Pekko circuit breaker: as ditto-postgres-things-journal (MongoDB journal values, BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?BREAKER_MAXTRIES}
    call-timeout = 5s
    call-timeout = ${?BREAKER_TIMEOUT}
    reset-timeout = 3s
    reset-timeout = ${?BREAKER_RESET}
  }

  # JSONB event adapter (peer of the Mongo ConnectivityMongoEventAdapter binding). The `java.lang.String` binding is
  # the read/replay-side peer of the Mongo `"org.bson.BsonValue" = mongodbobject` binding: PostgresJournalOps.toRepr
  # replays a java.lang.String payload, and without this binding EventAdapters.get(String.class) falls back to
  # IdentityEventAdapter and every event is silently dropped on recovery.
  event-adapters {
    postgresjsonb = "org.eclipse.ditto.connectivity.service.messaging.persistence.ConnectivityPostgresEventAdapter"
  }

  event-adapter-bindings {
    # Fallback for internal events implementing only the base Event interface (e.g. EmptyEvent used by
    # the always-alive/priority journal-tag path) — Mongo parity with connectivity.conf's base binding.
    "org.eclipse.ditto.base.model.signals.events.Event" = postgresjsonb
    "org.eclipse.ditto.connectivity.model.signals.events.ConnectivityEvent" = postgresjsonb
    "java.lang.String" = postgresjsonb
  }
}

ditto-postgres-connections-snapshots {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.snapshot.PostgresSnapshotStore"
  plugin-dispatcher = "connection-persistence-dispatcher"
  entity = "connections"

  # Pekko circuit breaker: as ditto-postgres-things-snapshots (MongoDB snapshot values, SNAPSHOT_BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?SNAPSHOT_BREAKER_MAXTRIES}
    call-timeout = 10s
    call-timeout = ${?SNAPSHOT_BREAKER_TIMEOUT}
    reset-timeout = 6s
    reset-timeout = ${?SNAPSHOT_BREAKER_RESET}
  }
}

# ===== wot-validation-config =====

ditto-postgres-wot-journal {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.journal.PostgresJournal"
  plugin-dispatcher = "thing-journal-persistence-dispatcher"
  entity = "wot"

  # Pekko circuit breaker: as ditto-postgres-things-journal (MongoDB journal values, BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?BREAKER_MAXTRIES}
    call-timeout = 5s
    call-timeout = ${?BREAKER_TIMEOUT}
    reset-timeout = 3s
    reset-timeout = ${?BREAKER_RESET}
  }

  # JSONB event adapter (peer of the Mongo WotValidationConfigMongoEventAdapter binding in the
  # pekko-contrib-mongodb-persistence-wot-validation-config-journal block). The `java.lang.String` binding is the
  # read/replay-side peer of the Mongo `"org.bson.BsonValue" = ...` binding: PostgresJournalOps.toRepr replays a
  # java.lang.String payload, and without this binding EventAdapters.get(String.class) falls back to
  # IdentityEventAdapter and every event is silently dropped on recovery.
  event-adapters {
    wotvalidation = "org.eclipse.ditto.things.service.persistence.serializer.WotValidationConfigPostgresEventAdapter"
  }

  event-adapter-bindings {
    # Fallback for internal events implementing only the base Event interface (e.g. EmptyEvent used by
    # the always-alive/priority journal-tag path) — Mongo parity with connectivity.conf's base binding.
    "org.eclipse.ditto.base.model.signals.events.Event" = wotvalidation
    "org.eclipse.ditto.things.model.devops.events.WotValidationConfigEvent" = wotvalidation
    "java.lang.String" = wotvalidation
  }
}

ditto-postgres-wot-snapshots {
  class = "org.eclipse.ditto.internal.utils.persistence.postgres.snapshot.PostgresSnapshotStore"
  plugin-dispatcher = "thing-snaps-persistence-dispatcher"
  entity = "wot"

  # Pekko circuit breaker: as ditto-postgres-things-snapshots (MongoDB snapshot values, SNAPSHOT_BREAKER_* variables).
  circuit-breaker {
    max-failures = 5
    max-failures = ${?SNAPSHOT_BREAKER_MAXTRIES}
    call-timeout = 10s
    call-timeout = ${?SNAPSHOT_BREAKER_TIMEOUT}
    reset-timeout = 6s
    reset-timeout = ${?SNAPSHOT_BREAKER_RESET}
  }
}


# ---------------------------------------------------------------------------------------------------------------------
# R2DBC client / pool / SSL defaults (`ditto.postgresql.*`).
#
# The shared, backend-agnostic Postgres CLIENT config (uri / pool / SSL / credentials) read by
# DittoPostgresClient / ConnectionPoolFactory now lives in `ditto-postgres-client.conf` (internal/utils/postgres-client)
# and is pulled in via this single include, so the pool/SSL/credentials are single-sourced across every Postgres-backed
# component. The MERGED config a persistence service sees is identical to when the block was inlined here.
# ---------------------------------------------------------------------------------------------------------------------

include classpath("ditto-postgres-client")
