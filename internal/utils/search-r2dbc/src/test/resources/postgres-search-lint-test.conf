# Test profile for PostgresSearchProfileHoconLintTest — mirrors the include order a real search-pg-dev.conf will use
# (Phase H): the common Ditto service-base layer FIRST (exactly the fallback RawConfigSupplier — the real Ditto boot
# mechanism — layers under every service conf: "1. service-specific env config, 2. service-specific base config,
# 3. common ditto-service-base config" — internal/utils/config's RawConfigSupplier#get()), then the REAL thing-search
# service defaults, then the opt-in Postgres search profile OVERLAID on top (later include wins for any overlapping
# key). Without the ditto-service-base layer, search.conf's own `${ditto.mongodb.options.readConcern}` substitution
# (defaulted by ditto-mongo.conf, itself included from ditto-service-base.conf) is left unresolved — a real boot never
# hits this because RawConfigSupplier always layers ditto-service-base underneath every service conf.
# "ditto-service-base" and "search" resolve from their respective main resources (both on this module's test
# classpath — internal/utils/config transitively, ditto-thingsearch-service as a direct test-scope dependency);
# "ditto-postgres-search" resolves from this module's own main resources.
include classpath("ditto-service-base")
include classpath("search")
include classpath("ditto-postgres-search")
