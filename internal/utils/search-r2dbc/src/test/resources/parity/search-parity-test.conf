# Minimal service-shaped config for the parity matrix IT (SearchBackendParityIT).
# Loaded via ConfigFactory.load(...) so library reference.conf defaults are merged in.
# - ditto.limits.search feeds BOTH backends' QueryBuilderFactory (identical page-size limits, a parity precondition).
# - ditto.mongodb.uri is a placeholder: the IT builds its own MongoClientWrapper from the container's bind IP/port.
ditto {
  mongodb {
    uri = "mongodb://localhost:27017/searchParityPlaceholder"
  }
  limits {
    search {
      default-page-size = 25
      max-page-size = 200
    }
  }
  search {}
}
