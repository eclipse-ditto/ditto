# Test profile: activates the PostgreSQL things-search backend exactly as a deployment would, by including the shipped
# opt-in profile. Proves ditto.extensions.search-persistence-provider resolves to PostgresSearchPersistenceProvider and
# that the nested `include classpath("ditto-postgres-client")` resolves from search-r2dbc's classpath (postgres-client
# is a compile dependency, so its resources are present). Falls back to reference.conf for the Pekko actor system.
include classpath("ditto-postgres-search")

# Tests that bootstrap through the provider must never stop their ActorSystem through coordinated shutdown unless
# they test exactly that.
ditto.postgresql.bootstrap.exit-on-failure = false
