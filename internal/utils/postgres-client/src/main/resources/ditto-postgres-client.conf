# ---------------------------------------------------------------------------------------------------------------------
# R2DBC client / pool / SSL defaults (`ditto.postgresql.*`).
#
# The shared, backend-agnostic Postgres CLIENT configuration read by DittoPostgresClient / ConnectionPoolFactory /
# PostgresClientExtension (internal/utils/postgres-client). Every Postgres-backed component (the event-sourcing
# persistence backend, the search backend, ...) includes this ONE block so the pool/SSL/credentials are single-sourced.
# Formerly folded into `ditto-postgres-persistence.conf`; factored out here as part of the postgres-client extraction so
# `ditto-postgres-persistence.conf` (and, later, the search profile) `include classpath("ditto-postgres-client")`.
# Defaults mirror the deployed Mongo baseline so the backend can be swapped without re-tuning -- EXCEPT the pool. Its
# size (pool.max-size, 25 per service instance) is a share of PostgreSQL's max_connections, which every replica of every
# PostgreSQL-backed service draws from (see "Connection budget" in the pool block). Its overload settings
# (connect-timeout, pool.max-acquire-time, pool.acquire-retry, pool.pending-acquire-max-size) are kept below the
# caller's 5s deadline on purpose (see the pool block).
# ---------------------------------------------------------------------------------------------------------------------

ditto {
  postgresql {
    # R2DBC URL. Runtime role is DML-only (SELECT/INSERT/UPDATE/DELETE), no CREATE.
    uri = "r2dbc:postgresql://localhost:5432/ditto"
    uri = ${?POSTGRES_URI}

    # Optional runtime credentials; may instead be embedded in the URI.
    username = ""
    username = ${?POSTGRES_USER}
    password = ""
    password = ${?POSTGRES_PASSWORD}

    # direct | session | transaction -- how connections reach PostgreSQL. Does not shape the pool (fetch-size=0 and
    # prepared-statement-cache-queries=0 keep it PgBouncer-safe in every mode), but it gates the search path-index
    # maintenance: with "transaction" and no ditto.postgresql.search.path-indexes.direct-uri, CREATE INDEX
    # CONCURRENTLY cannot hold the session it needs, so the maintenance logs and skips while the service keeps
    # serving. Also drives a startup WARN cross-check vs prepared-statement-cache-queries. Never blocks boot.
    pooler-mode = "direct"
    pooler-mode = ${?POSTGRES_POOLER_MODE}

    # TCP connect timeout for opening a physical connection (r2dbc SPI CONNECT_TIMEOUT). Bounds how long a pool borrow
    # may block on a dead/unreachable host before failing fast. Keep STRICTLY LESS THAN pool.max-acquire-time (4s): a
    # borrow that has to open a fresh connection spends up to connect-timeout on the handshake WITHIN the
    # max-acquire-time budget, so connect-timeout < max-acquire-time lets the acquire surface the real connect failure
    # rather than a generic acquire timeout. Lower both together (ConnectionPoolFactory WARNs at startup if they are
    # not). Also bounds each connect of the schema bootstrap (see bootstrap below: a connect timeout there is retried).
    connect-timeout = 2s
    connect-timeout = ${?POSTGRES_CONNECT_TIMEOUT}

    # Server-side statement_timeout: aborts any single statement that runs longer (SQLSTATE 57014, query_canceled).
    # Sent as a connection STARTUP parameter via the r2dbc-postgresql "options" map (a GUC name->value map, e.g.
    # {"statement_timeout":"60000"} in millis; each entry becomes a startup parameter of its own) rather than a plain
    # per-session "SET", which under transaction pooling would only reach the one server connection that ran it.
    #
    # 0 sends NO startup parameter; it does not mean "no timeout". The server-side default then applies on every path:
    # 60s for ditto_app as provisioned by deployment/postgres/provisioning/01-roles-and-grants.sql (no timeout only if
    # role, database and server set none). To lift the cap:
    #   - direct connection, or PgBouncer with track_extra_parameters: set a large value here; it reaches the server
    #     and overrides the role default (this key cannot send an explicit 0);
    #   - PgBouncer with ignore_startup_parameters: nothing set here reaches the server, so change the role default
    #     (ALTER ROLE ditto_app SET statement_timeout = 0, or ... RESET statement_timeout), then RECONNECT PgBouncer.
    #     While this key is 0, changing the role default works on every path.
    #
    # PgBouncer, in session and transaction mode alike, refuses a startup parameter it neither tracks nor ignores
    # ("unsupported startup parameter: ..."; verified with PgBouncer 1.26.0, and how a parameter PostgreSQL does not
    # report to clients, like statement_timeout, is tracked may differ between PgBouncer versions). The driver also
    # always sends extra_float_digits, and things-search also plan_cache_mode (force-custom-plan). So configure
    # PgBouncer with one of:
    #   - RECOMMENDED: ignore_startup_parameters = extra_float_digits and
    #     track_extra_parameters = statement_timeout,plan_cache_mode: PgBouncer applies each client's values to the
    #     server connection it hands out, also per transaction, so this key is enforced as on a direct connection;
    #   - ignore_startup_parameters = extra_float_digits,statement_timeout (things-search: also plan_cache_mode):
    #     PgBouncer DROPS the value, so this key is silently NOT enforced. What is enforced then is the runtime role's
    #     default, which the provisioning script sets:   ALTER ROLE ditto_app SET statement_timeout = '60s';
    #     It applies to every server session PgBouncer opens as ditto_app, so PgBouncer's [databases] entry must not
    #     force a user= (an auth_user= is fine: it only runs the auth query).
    # Where the startup parameter reaches the server (direct connection, or PgBouncer with track_extra_parameters), it
    # overrides the role default. Details, including the DDL role: deployment/postgres/README.md.
    statement-timeout = 60s
    statement-timeout = ${?POSTGRES_STATEMENT_TIMEOUT}

    schema {
      # Schema bootstrap at every start (not configurable): when the stored schema_version row has this code's version
      # and checksum and every table and index the component's DDL creates exists, the start runs NO DDL and takes no
      # lock on the component's tables (so it never waits for e.g. a running CREATE INDEX CONCURRENTLY). Otherwise it
      # runs the idempotent DDL with lock_timeout = 500ms: a start that cannot get a table lock in time fails without
      # changing anything and is retried by the next start (the service then stops, see bootstrap.exit-on-failure, and
      # its orchestrator restarts it). Consequence: a manually dropped table or index is re-created at the next start,
      # but a manually reset reloption (e.g. autovacuum_vacuum_scale_factor) is not re-applied until the next schema
      # version bump or a self-heal that runs the DDL.
      #
      # Runtime schema self-heal of the persistence services (policies, things, connectivity). things-search does NOT
      # self-heal at runtime: its statements bypass it, and a missing search table is re-created only by the schema
      # check of its next start. When true (default) and a runtime statement hits a missing table (SQLSTATE 42P01),
      # the backend runs the schema check of every registered component once more, under the shared advisory lock and
      # via the DDL role, with the start's rules (no DDL while the stored row has this code's version and checksum and
      # every table and index exists; no DDL against a newer stored schema version; DDL under the 500 ms
      # lock_timeout), runs the schema's idempotent DDL where needed, and retries the statement once. The heal neither
      # verifies the catalog nor writes the schema_version row (the next start does). It is the Postgres counterpart of
      # MongoDB's implicit-collection-create-on-first-use, so a dropped / recreated database heals instead of failing
      # every persistence call (e.g. list-connections 500ing after the DB volume was recreated under a running
      # service), and so it MASKS DATA LOSS (a wiped DB silently continues with empty tables), the same trade-off
      # MongoDB has. Only a heal that ran DDL logs the WARN "Missing PostgreSQL table detected; recreated the schema
      # ..." and increments ditto_persistence_schema_self_heal (once per component); a heal that ran no DDL logs INFO
      # only, and a heal that failed logs "PostgreSQL schema self-heal failed; ..." (WARN) and is not counted.
      # Set false to fail loud instead: the original 42P01 error then surfaces unchanged (the schema check at the
      # next start still re-creates missing tables). NOTE: healing needs the bootstrap's privileges: it connects as
      # the ddl-credentials role (or the runtime role when ddl-credentials are empty). A role without CREATE on the
      # schema (e.g. ditto_app of the provisioning script) makes every heal fail with 42501, and the original error
      # surfaces (self-heal is then "disabled in effect"). Operator docs: installation-extending.md, section
      # "Operating PostgreSQL".
      self-heal = true
      self-heal = ${?POSTGRES_SCHEMA_SELF_HEAL}
    }

    # Schema bootstrap at service start. One attempt = connect + (things-search: the database prerequisites) + the
    # schema check/DDL described in `schema` above, in one transaction under the shared advisory lock. Every
    # PostgreSQL-backed service (policies, things, connectivity, things-search on PostgreSQL) runs it once, after it
    # joined the cluster; an outage while the service runs never goes through it.
    bootstrap {
      # Max time ONE attempt may take. Running out of it is NOT retried: PostgreSQL accepted the connection but the
      # bootstrap is stuck -- usually another session holds the schema advisory lock or a conflicting table lock (the
      # error names the pg_locks query that shows the holder); behind PgBouncer a down backend looks the same, because
      # PgBouncer queues the client.
      attempt-timeout = 60s
      attempt-timeout = ${?POSTGRES_BOOTSTRAP_ATTEMPT_TIMEOUT}

      retry {
        # Wait for PostgreSQL at start: exponential backoff from min-backoff to max-backoff, +-20% jitter, one WARN
        # per failed attempt. Retried: connection refused / timed out (connect-timeout) / reset, host name not
        # resolvable (yet), server starting up or shutting down (SQLSTATE 57P03, 57P01, 57P02), no free connection
        # slot (53300). NEVER retried: schema drift, an incompatible schema version or unmet database prerequisites
        # (refuse to boot), TLS and certificate errors, authentication and privilege errors (28000, 28P01, 42501), an
        # unknown database (3D000), PgBouncer's own errors (08P01), a DDL lock timeout (55P03), statement_timeout
        # (57014), an attempt timeout, and anything else not listed as retried.
        enabled = true
        enabled = ${?POSTGRES_BOOTSTRAP_RETRY_ENABLED}
        # Total wait, counted from the first attempt; the last attempt starts no later than this. 0s = no limit.
        # Kubernetes: keep it below the liveness budget. With the Helm chart's probes (liveness from 60s, 6 failures
        # 10s apart) a pod is restarted about 110s after its container started, and the wait only begins once the
        # service joined the cluster (typically 15-30s after the start).
        max-duration = 60s
        max-duration = ${?POSTGRES_BOOTSTRAP_RETRY_MAX_DURATION}
        min-backoff = 1s
        min-backoff = ${?POSTGRES_BOOTSTRAP_RETRY_MIN_BACKOFF}
        max-backoff = 10s
        max-backoff = ${?POSTGRES_BOOTSTRAP_RETRY_MAX_BACKOFF}
      }

      # Stop the service (Pekko coordinated shutdown; exit code 1 where pekko.coordinated-shutdown.exit-jvm = on, as
      # in Ditto's service images) when the bootstrap finally fails -- a failure that is not retried, retries
      # exhausted, an attempt timeout or an invalid configuration -- or when the persistence services' plugin-wiring
      # check that precedes it fails, so that Docker Compose (restart) or Kubernetes restarts it, instead of leaving a
      # running JVM without its root actor. A shutdown during the wait ends it without counting as a failure.
      # false = keep the JVM running without the root actor.
      exit-on-failure = true
      exit-on-failure = ${?POSTGRES_BOOTSTRAP_EXIT_ON_FAILURE}
    }

    pool {
      # 0 = no connection is opened before the first borrow; the pool grows on demand (see "Connection establishment").
      initial-size = 0

      # --- Connection budget: max-size is per SERVICE INSTANCE ---------------------------------------------------
      # The journal, snapshot store and read journal of a service share ONE pool (PostgresClientExtension); the search
      # service, when it runs on PostgreSQL, has a pool of its own. So max-size is the number of connections ONE
      # instance of a PostgreSQL-backed service (policies, things, connectivity, things-search) may hold. The pools of
      # different services and replicas do not coordinate, so size them together, rolling-update pods included:
      #   SUM over those services of ((replicas + maxSurge) x max-size) + reserved connections <= max_connections
      # maxSurge is the number of extra pods a Deployment starts while it rolls (the Helm chart: 1 per service, and a
      # helm upgrade rolls them together). The old pod's pool is still open while it hands its entities over, and the
      # new pod recovers them with a pool of its own; between rollouts the sum is replicas x max-size.
      # Reserved: superuser_reserved_connections, monitoring, psql, and per service instance the connections opened
      # outside the pool: a DDL connection for the schema bootstrap and the schema self-heal, and in things-search the
      # path-index maintenance at every start (two while an index builds; to path-indexes.direct-uri if set, else uri).
      # Behind PgBouncer the sum counts against PgBouncer's max_client_conn (and its server pool, if PgBouncer must
      # never queue a transaction), and PgBouncer's server pool plus the reserved connections against max_connections.
      # Default 25: the three persistence services at one replica each take 75 between rollouts, within PostgreSQL's
      # stock max_connections = 100, but up to 150 while all three roll (100 when they roll one at a time). So a stock
      # server, things-search on PostgreSQL or more replicas need a larger max_connections, smaller per-service values
      # or PgBouncer. Borrowers beyond max-size wait in the pending-acquire queue (default 2 x max-size = 50) for at
      # most max-acquire-time, so one instance serves up to 75 concurrent borrowers before it sheds load. Steady-state
      # demand is about one connection per statement in flight, far below 25 in the measurements so far. Production
      # sizing must be confirmed by load testing. Override per service via POSTGRES_POOL_MAX_SIZE and re-check the sum
      # before scaling a service out. Operator guide: deployment/postgres/README.md, "Connection budget".
      max-size = 25
      max-size = ${?POSTGRES_POOL_MAX_SIZE}

      # --- Pool overload: the acquire budget must fit INSIDE the caller's deadline ---------------------------------
      # A journal write that cannot get a connection within the acquire budget fails its Future, which STOPS the
      # persistent actor (Pekko WriteMessageFailure; NOT backpressure; the entity restarts with backoff). That is not
      # what breaks first, though: the caller gives up earlier. Things and policies commands wait 5s for the
      # persistence actor -- the supervisor's local-ask.timeout: for things
      # `ditto.things.thing.supervisor.local-ask.timeout` (things.conf:256, env THINGS_SUPERVISOR_LOCAL_ASK_TIMEOUT);
      # policies declare no local-ask block and use the code default
      # `LocalAskTimeoutConfig.LocalAskTimeoutConfigValue.ASK_TIMEOUT` (base/service LocalAskTimeoutConfig.java:62) --
      # and then fail with EnforcementTimeoutException.
      # A borrow that is still queued after 5s and then SUCCEEDS commits a write the caller was already told had
      # failed (e.g. CreateThing leaves an orphan Policy behind). So a LONGER acquire budget never helps: it only
      # widens that window. Keep (1 + acquire-retry) x max-acquire-time < 5s, and treat sustained queueing as a
      # capacity problem (max-size, PgBouncer, upstream throttling), not as a reason to raise these values.
      # (The mismatch is not Postgres-specific: MongoDB's journal plugin, pekko-persistence-mongodb, waits up to
      # 2 minutes (waitqueuetimeout) for a connection, far past the 5s deadline.)
      # These settings apply to every borrow from the shared pool -- journal writes, recovery reads, snapshots, the
      # read journal and (in the search service) search queries/updates.
      #
      # Effective acquire budget = (1 + acquire-retry) x max-acquire-time = 4s by default.
      max-acquire-time = 4s
      max-acquire-time = ${?POSTGRES_POOL_MAX_ACQUIRE_TIME}
      # r2dbc-pool re-subscribes a failed acquire this many times, each with a FRESH max-acquire-time; the library
      # default of 1 silently doubles the budget (30s used to mean 60s). It also retries acquire timeouts and
      # pending-limit rejections, where a retry cannot help. Keep 0.
      acquire-retry = 0
      acquire-retry = ${?POSTGRES_POOL_ACQUIRE_RETRY}
      # Maximum number of borrowers that may WAIT once all max-size connections are in use; borrowers beyond it fail
      # IMMEDIATELY with PoolAcquirePendingLimitException (a journal write reports it as PostgresPoolOverloadException,
      # "PostgreSQL pool overload"), instead of queueing behind a deadline nobody will wait for. Deliberately no value
      # here: unset = 2 x max-size, derived in code so it follows a max-size override. 0 = no queue at all.
      # -1 = unbounded (r2dbc-pool's own default) -- discouraged: an unbounded queue only holds borrowers whose callers
      # have given up, and hides the overload signal; ConnectionPoolFactory WARNs at startup.
      pending-acquire-max-size = ${?POSTGRES_POOL_PENDING_ACQUIRE_MAX_SIZE}
      # ------------------------------------------------------------------------------------------------------------

      # Connection establishment is not rate-limited: the pool opens a connection whenever a borrower finds none idle,
      # up to max-size connections open or opening, each handshake bounded by connect-timeout. r2dbc-pool has no
      # counterpart of MongoDB's maxConnecting, so a burst against a cold pool opens up to max-size connections per
      # instance at once: the budget sum above also bounds the simultaneous handshakes PostgreSQL sees.
      #
      # max-idle-time = 0s does NOT mean "no limit": 0s leaves r2dbc-pool's default in place, which closes a connection
      # after 30 minutes idle (an explicit zero duration would close idle connections at once, so Ditto never passes
      # it). Connections a burst opened therefore keep their max_connections slots for up to 30 minutes.
      max-idle-time = 0s
      # 0s = no limit (r2dbc-pool's default): a connection is never retired because of its age.
      max-life-time = 0s
      # no server-side portal/cursor; keeps transaction-pooling safe.
      fetch-size = 0
      # 0 = unnamed statements -> safe under PgBouncer txn pooling on ANY version. Set >0 only behind
      # PgBouncer >= 1.21 with max_prepared_statements > 0.
      prepared-statement-cache-queries = 0

      # DDL role: OWNS the schema/tables (CREATE). Used by the schema bootstrap, the runtime self-heal and the per-path
      # search index builds (CREATE/DROP INDEX CONCURRENTLY). Empty -> reuse the runtime role.
      ddl-credentials {
        username = ""
        username = ${?POSTGRES_DDL_USER}
        password = ""
        password = ${?POSTGRES_DDL_PASSWORD}
      }
    }

    ssl {
      # disable | allow | prefer | require | verify-ca | verify-full ; r2dbc Option "sslMode".
      # verify-full validates the server cert chain AND the hostname.
      mode = "verify-full"
      mode = ${?POSTGRES_SSL_MODE}
      # r2dbc "sslRootCert": PEM CA bundle the server cert must chain to.
      root-cert = ""
      root-cert = ${?POSTGRES_SSL_ROOT_CERT}
      # Ditto guard: refuse to boot if mode is verify-(ca|full) AND root-cert unset.
      allow-system-truststore = false
      # Optional mTLS (r2dbc "sslCert"/"sslKey"/"sslPassword"); PEM cert + PKCS#8 key.
      cert = ""
      cert = ${?POSTGRES_SSL_CERT}
      key = ""
      key = ${?POSTGRES_SSL_KEY}
      key-password = ""
      key-password = ${?POSTGRES_SSL_KEY_PASSWORD}
    }
  }
}

# Exit status of a service that stops because its PostgreSQL schema bootstrap or plugin-wiring check failed (see
# ditto.postgresql.bootstrap.exit-on-failure): 1 instead of Pekko's default 0, so that the failed start is reported as
# an error (Kubernetes "Error" instead of "Completed"; Docker Compose "restart: on-failure" restarts it). Takes effect
# only where pekko.coordinated-shutdown.exit-jvm = on. The key is the class name of the shutdown reason.
pekko.coordinated-shutdown.reason-overrides {
  "org.eclipse.ditto.internal.utils.persistence.postgres.client.PostgresSchemaBootstrapper$BootstrapFailed" {
    exit-code = 1
  }
}
