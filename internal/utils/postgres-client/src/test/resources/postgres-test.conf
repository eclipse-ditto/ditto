ditto {
  postgresql {
    uri = "r2dbc:postgresql://db.example:6432/ditto_test"
    username = "ditto_runtime"
    password = "runtime_secret"
    pooler-mode = "transaction"
    connect-timeout = 7s
    statement-timeout = 90s

    bootstrap {
      attempt-timeout = 13s
      exit-on-failure = false
      retry {
        enabled = false
        max-duration = 0s
        min-backoff = 250ms
        max-backoff = 3s
      }
    }

    pool {
      initial-size = 5
      max-size = 200
      max-acquire-time = 42s
      acquire-retry = 2
      pending-acquire-max-size = 17
      max-idle-time = 5m
      max-life-time = 30m
      fetch-size = 50
      prepared-statement-cache-queries = 256
      ddl-credentials {
        username = "ditto_ddl"
        password = "ddl_secret"
      }
    }

    ssl {
      mode = "verify-ca"
      root-cert = "/etc/ditto/pg-tls/ca.crt"
      allow-system-truststore = false
      cert = "/etc/ditto/pg-tls/client.crt"
      key = "/etc/ditto/pg-tls/client.key"
      key-password = "key_secret"
    }
  }
}
