#
# Version marker for the same-release check of the MongoDB extension JARs (MongoSearchExtensionSelfCheck).
# component = which of the two MongoDB extension JARs this is; version = the Ditto release it was built from.
# All MongoDB extension JARs on a classpath must have the same version.
#
component=persistence (ditto-mongo-persistence-extension)
version=${project.version}
