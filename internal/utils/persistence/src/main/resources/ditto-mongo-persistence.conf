# ---------------------------------------------------------------------------------------------------------------------
# Ditto MongoDB persistence PROFILE.
#
# Carries the whole MongoDB persistence wiring of the things, policies and connectivity services: the
# `ditto.mongodb.*` client defaults (ditto-mongo.conf), the persistence backend provider and its plugin ids, the
# per-entity auto-start keys each service conf maps onto `pekko.persistence.*`, the shared
# `pekko.contrib.persistence.mongodb.mongo` plugin settings and every `pekko-contrib-mongodb-persistence-*` plugin
# block.
#
# A service conf includes it through the fixed-name wrapper `ditto-persistence-backend.conf` of this module. Where
# two backends share a classpath, an overlay or a test includes this profile by its unique name instead.
# ---------------------------------------------------------------------------------------------------------------------

include required(classpath("ditto-mongo"))

ditto {
  extensions {
    # Names the MongoDB provider and its plugin ids here as well as in reference.conf, so that this profile wins
    # over another backend's profile that shares the fixed-name include on the same classpath.
    persistence-backend-provider {
      extension-class = "org.eclipse.ditto.internal.utils.persistence.mongo.MongoPersistenceBackendProvider"
      extension-config.plugin-ids {
        thing.journal                  = "pekko-contrib-mongodb-persistence-things-journal"
        thing.snapshot                 = "pekko-contrib-mongodb-persistence-things-snapshots"
        policy.journal                 = "pekko-contrib-mongodb-persistence-policies-journal"
        policy.snapshot                = "pekko-contrib-mongodb-persistence-policies-snapshots"
        connection.journal             = "pekko-contrib-mongodb-persistence-connection-journal"
        connection.snapshot            = "pekko-contrib-mongodb-persistence-connection-snapshots"
        wot-validation-config.journal  = "pekko-contrib-mongodb-persistence-wot-validation-config-journal"
        wot-validation-config.snapshot = "pekko-contrib-mongodb-persistence-wot-validation-config-snapshots"
      }
    }
  }

  # Per-entity auto-start lists; each service conf assigns its own entity's lists to pekko.persistence.*.
  # The wot-validation-config plugins are not auto-started.
  persistence-backend {
    name = "mongodb"
    auto-start {
      things      { journals = ["pekko-contrib-mongodb-persistence-things-journal"],     snapshots = ["pekko-contrib-mongodb-persistence-things-snapshots"] }
      policies    { journals = ["pekko-contrib-mongodb-persistence-policies-journal"],   snapshots = ["pekko-contrib-mongodb-persistence-policies-snapshots"] }
      connections { journals = ["pekko-contrib-mongodb-persistence-connection-journal"], snapshots = ["pekko-contrib-mongodb-persistence-connection-snapshots"] }
    }
  }
}

pekko.contrib.persistence.mongodb.mongo {
  driver = "org.eclipse.ditto.internal.utils.persistence.pekko.CustomizableScalaDriverPersistenceExtension"

  # Write concerns are one of: Unacknowledged, Acknowledged, Journaled, ReplicaAcknowledged
  journal-write-concern = "Acknowledged" # By default was: "Journaled"
  journal-write-concern = ${?PEKKO_PERSISTENCE_MONGO_JOURNAL_WRITE_CONCERN}
  journal-wtimeout = 10000
  journal-wtimeout = ${?PEKKO_PERSISTENCE_MONGO_JOURNAL_WRITE_TIMEOUT}
  journal-fsync = false
  journal-fsync = ${?PEKKO_PERSISTENCE_MONGO_JOURNAL_FSYNC}

  snaps-write-concern = "Acknowledged" # By default was: "Journaled"
  snaps-write-concern = ${?PEKKO_PERSISTENCE_MONGO_SNAPS_WRITE_CONCERN}
  snaps-wtimeout = 5000
  snaps-wtimeout = ${?PEKKO_PERSISTENCE_MONGO_SNAPS_WRITE_TIMEOUT}
  snaps-fsync = false
  snaps-fsync = ${?PEKKO_PERSISTENCE_MONGO_SNAPS_FSYNC}

  realtime-enable-persistence = false

  metrics-builder {
    class = "org.eclipse.ditto.internal.utils.persistence.mongo.metrics.MongoMetricsBuilder"
    class = ${?MONGO_METRICS_BUILDER_CLASS}
  }
}

pekko-contrib-mongodb-persistence-things-journal {
  class = "pekko.contrib.persistence.mongodb.MongoJournal"
  plugin-dispatcher = "thing-journal-persistence-dispatcher"

  circuit-breaker {
    max-failures = 5 # if an exception during persisting an event/snapshot occurs this often -- a successful write resets the counter
    max-failures = ${?BREAKER_MAXTRIES}
    call-timeout = 5s # MongoDB Timeouts causing the circuitBreaker to open
    call-timeout = ${?BREAKER_TIMEOUT}
    reset-timeout = 3s # after this time in "Open" state, the cicuitBreaker is "Half-opened" again
    reset-timeout = ${?BREAKER_RESET}
  }

  overrides {
    journal-collection = "things_journal"
    journal-index = "things_journal_index"
    realtime-collection = "things_realtime"
    metadata-collection = "things_metadata"
    metadata-index = "things_metadata_index"
  }

  event-adapters {
    mongodbobject = "org.eclipse.ditto.internal.utils.persistence.mongo.adapters.ThingMongoEventAdapter"
    wotvalidation = "org.eclipse.ditto.internal.utils.persistence.mongo.adapters.WotValidationConfigMongoEventAdapter"
  }

  event-adapter-bindings {
    "org.eclipse.ditto.things.model.signals.events.ThingEvent" = mongodbobject
    "org.bson.BsonValue" = mongodbobject
    "org.eclipse.ditto.things.model.devops.events.WotValidationConfigEvent" = wotvalidation
  }
}

pekko-contrib-mongodb-persistence-things-journal-read {
  class = "pekko.contrib.persistence.mongodb.MongoReadJournal"
  plugin-dispatcher = "thing-journal-persistence-dispatcher"

  overrides {
    journal-collection = "things_journal"
