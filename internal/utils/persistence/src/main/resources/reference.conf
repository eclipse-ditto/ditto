ditto {
  extensions {
    persistence-backend-provider = {
      extension-class = "org.eclipse.ditto.internal.utils.persistence.mongo.MongoPersistenceBackendProvider"
      extension-config {
        # Explicit MongoDB plugin-id mappings per entity type.
        #
        # NOTE: as of Task 9, MongoPersistenceBackendProvider no longer falls back to a pluralize()
        # heuristic (entityType + "s") when no override is present here. That heuristic produced the
        # CORRECT block for "thing" -> "...-things-*" but the WRONG block for entities whose shipped
        # Mongo plugin blocks do NOT follow the simple "+s" rule (e.g. "policy" -> "policys" instead of
        # the real "policies"; "connection" -> "connections" instead of the real "connection") —
        # taking down PolicyPersistenceActor / ConnectionPersistenceActor / WotValidationConfigPersistenceActor
        # with "Journal plugin [...] configuration doesn't exist." whenever these overrides were absent,
        # which the string-shorthand extension declaration (`persistence-backend-provider = "<class>"`)
        # made trivially easy to trigger by wiping this whole extension-config object.
        # The provider now resolves plugin IDs via override -> an in-code WELL_KNOWN_BLOCK_NAMES map
        # (MongoPersistenceBackendProvider.java) -> a hard DittoConfigError for unknown entity types.
        # The overrides below are therefore REDUNDANT with that in-code map for these four entity types —
        # they are kept purely as human-readable documentation of the real shipped block names, and are
        # harmless: an override here simply reproduces what the in-code map would already resolve to.
        # The block names below match the real `pekko-contrib-mongodb-persistence-*` blocks shipped
        # in policies.conf / connectivity.conf / things.conf (and their test.conf counterparts).
        plugin-ids {
          thing.journal                  = "pekko-contrib-mongodb-persistence-things-journal"
          thing.snapshot                 = "pekko-contrib-mongodb-persistence-things-snapshots"
          policy.journal                 = "pekko-contrib-mongodb-persistence-policies-journal"
          policy.snapshot                = "pekko-contrib-mongodb-persistence-policies-snapshots"
          connection.journal             = "pekko-contrib-mongodb-persistence-connection-journal"
          connection.snapshot            = "pekko-contrib-mongodb-persistence-connection-snapshots"
          wot-validation-config.journal  = "pekko-contrib-mongodb-persistence-wot-validation-config-journal"
          wot-validation-config.snapshot = "pekko-contrib-mongodb-persistence-wot-validation-config-snapshots"
        }
      }
    }
  }
}
