ditto.enforcement {
  # configuration for retrieval of entities during enforcement via sharding
  ask-with-retry {
    # maximum duration to wait for answers from entity shard regions
    ask-timeout = 3s
    ask-timeout = ${?ENFORCEMENT_ASK_TIMEOUT}

    # one of: OFF, NO_DELAY, FIXED_DELAY, BACKOFF_DELAY
    retry-strategy = BACKOFF_DELAY
    retry-strategy = ${?ENFORCEMENT_ASK_RETRY_STRATEGY}

    retry-attempts = 3
    retry-attempts = ${?ENFORCEMENT_ASK_TIMEOUT_RETRIES}

    fixed-delay = 5s
    fixed-delay = ${?ENFORCEMENT_ASK_FIXED_DELAY}

    backoff-delay {
      min = 100ms
      min = ${?ENFORCEMENT_ASK_BACKOFF_DELAY_MIN}
      max = 10s
      max = ${?ENFORCEMENT_ASK_BACKOFF_DELAY_MAX}
      # must be between 0.0 and 1.0:
      random-factor = 0.5
      random-factor = ${?ENFORCEMENT_ASK_BACKOFF_DELAY_RANDOM_FACTOR}
    }
  }

  # Compensating deletion of a policy that was created for a thing whose creation then failed, e.g. because the
  # thing's journal write failed under persistence overload. While the policy's persistence actor restarts after the
  # same overload, the policies service answers such a deletion as unavailable or not at all, so the deletion is
  # retried. The reply to the failed thing creation waits for this rollback: with the defaults at most 4 attempts of
  # up to 3s each, with pauses of 1-1.5s, 2-3s and 4-6s in between (at most about 22.5s in total).
  created-policy-rollback {
    ask-timeout = 3s
    ask-timeout = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_ASK_TIMEOUT}

    # one of: OFF, NO_DELAY, FIXED_DELAY, BACKOFF_DELAY
    retry-strategy = BACKOFF_DELAY
    retry-strategy = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_RETRY_STRATEGY}

    retry-attempts = 3
    retry-attempts = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_RETRY_ATTEMPTS}

    fixed-delay = 2s
    fixed-delay = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_FIXED_DELAY}

    backoff-delay {
      # the n-th retry waits min(max, min * 2^n) * (1 + random * random-factor)
      min = 500ms
      min = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_BACKOFF_DELAY_MIN}
      max = 4s
      max = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_BACKOFF_DELAY_MAX}
      # must be between 0.0 and 1.0:
      random-factor = 0.5
      random-factor = ${?ENFORCEMENT_CREATED_POLICY_ROLLBACK_BACKOFF_DELAY_RANDOM_FACTOR}
    }
  }

  # whether to dispatch live response from channels other than subscribers of live messages.
  global-live-response-dispatching = true
  global-live-response-dispatching = ${?ENFORCEMENT_GLOBAL_LIVE_RESPONSE_DISPATCHING}

  # list of namespaces for which a special usage logging should be enabled in enforcement
  special-logging-inspected-namespaces = ${?ENFORCEMENT_SPECIAL_LOGGING_INSPECTED_NAMESPACES[]}
}