# ---------------------------------------------------------------------------------------------------------------------
# Ditto MongoDB search PROFILE.
#
# Carries the MongoDB wiring of the search service: the `ditto.mongodb.*` client defaults (ditto-mongo.conf) and the
# search persistence provider. search.conf includes it through the fixed-name wrapper `ditto-search-backend.conf` of
# this module; where two backends share a classpath, an overlay or a test includes it by its unique name instead.
# ---------------------------------------------------------------------------------------------------------------------

include required(classpath("ditto-mongo"))

ditto.extensions {
  # Pluggable thing-search persistence backend. This profile selects the MongoDB search provider; the PostgreSQL
  # search profile selects its own provider FQCN instead.
  search-persistence-provider = org.eclipse.ditto.thingsearch.persistence.mongo.MongoSearchPersistenceProvider
}
