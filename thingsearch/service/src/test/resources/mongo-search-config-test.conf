# The keys MongoSearchConfig reads, with the values of search.conf (substitutions resolved to their shipped values).
ditto {
  mongodb {
    uri = "mongodb://localhost:27017/test"
  }

  search {
    index-initialization {
      enabled = true

      activated-index-names = [
        "_namespace",
        "global_read",
        "v_wildcard",
        "policyId",
        "referencedPolicies",
        "deleteAt"
      ]

      custom-indexes {}
    }

    query {
      persistence {
        readPreference = primary
        readConcern = local
      }
    }

    simple-field-mappings {
      thingId = "_id"
      namespace = "_namespace"
      policyId = "/policyId"
      _revision = "/_revision"
      _modified = "/_modified"
      _created = "/_created"
      definition = "/definition"
    }

    updater {
      stream {
        persistence {
          parallelism = 2
          ack-delay = 0s
          with-acks-writeConcern = journaled
        }
      }

      persistence {
        readPreference = primary
        readConcern = local
      }
    }
  }
}
