# LOCAL-DEV Postgres profile for the Ditto Things-Search service.
#
# Selects the OPT-IN PostgreSQL search backend for local development via IntelliJ or the CLI. Injected as the
# highest-priority config layer:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs-path-to-this-file>   (or $PROJECT_DIR$ in IntelliJ)
#
# CLI TWIN: this file is the IntelliJ-run-config twin of deployment/postgres-local/search-postgres.conf — same two
# includes, same rationale. Keep both in sync: THIS file is referenced by the `SearchService (Postgres)` run config;
# the overlay under deployment/postgres-local/ is referenced by run-compound-postgres.sh (CLI). The only reason they
# are separate files is their different homes (main resources vs. the local-dev deployment dir).
#
# CLUSTERING: this profile does NOT override pekko.cluster.seed-nodes, so Things-Search joins the Policies-founded
# cluster at 2552 (its own artery port is 2557 from search-dev) and forms ONE shared cluster with Policies (+ Things
# + Connectivity + Gateway). Launch it alongside Policies (the compound `Ditto (Postgres)` run config /
# run-compound-postgres.sh), or restart it alone against an already-running Policies.
#
# Include order (later wins):
#   1. search-dev            — dev HTTP/cluster/seed settings + operator-metrics dev knobs (Mongo search backend by
#                              default)
#   2. ditto-postgres-search — swaps ditto.extensions.search-persistence-provider to the PostgreSQL provider and pulls
#                              in the shared ditto.postgresql.* client/pool/SSL defaults (single include, opt-in by
#                              design — see that file's header); all tuned via POSTGRES_* env vars at runtime, not
#                              hard-coded here.
#
# UNLIKE the persistence *-pg-dev.conf profiles, there is NO Pekko auto-start-journal narrowing here: the search
# backend is not a Pekko-persistence journal plugin at all (it has no journal / snapshot-store), so those config
# paths do not exist for search. search.conf's own ditto.mongodb defaults legitimately REMAIN present — the opt-in
# overlay only SWAPS the single search-persistence-provider extension key; it does not (and must not) delete unrelated
# Mongo config. (See PostgresSearchProfileHoconLintTest, which pins exactly this.)
#
# CLASSPATH NOTE: includes MUST use `include classpath("...")`. The FILE_BASED config is parsed with
# ConfigFactory.parseFileAnySyntax(file); a bare `include "..."` is file-relative and silently resolves to nothing for
# classpath resources. Both includes are at the TOP LEVEL.
#
# CLASSPATH REQUIREMENT: the search-r2dbc module jar and its runtime deps (postgres-client, r2dbc-postgresql,
# r2dbc-pool, reactor-core 3.5.x) must be on the run classpath — in IntelliJ this is supplied by the dedicated
# local-dev module `ide-postgres-launcher` (the run config points its "Use classpath of module" there while keeping the
# SearchService main class); on the CLI they are prepended before the thingsearch allinone jar by
# run-compound-postgres.sh (equivalent to mounting the ditto-postgres-client-extension + ditto-postgres-search-extension
# JAR pair in /opt/ditto/extensions/).
# ---------------------------------------------------------------------------------------------------------------------

# 1. Local-dev cluster / HTTP settings (Mongo search backend by default).
include classpath("search-dev")

# 2. Opt-in PostgreSQL search backend + shared R2DBC client/pool/SSL defaults (one file). TOP-LEVEL include.
include classpath("ditto-postgres-search")
