name: push-dockerhub-nightly

on:
  schedule:
    - cron: '0 1 * * *' # run at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'eclipse-ditto/ditto'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: nightly-ts-iotdb
    steps:
      -
        name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.0
      -
        name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: eclipsedittobot
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      -
        name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      -
        name: Build the timeseries service and the IoTDB extension
        run: |
          mvn clean install -T4 --batch-mode --errors -DskipTests -DskipITs -Dmaven.javadoc.skip=true \
            -pl timeseries/service,timeseries/iotdb -am
      -
        name: Stage the service jar and the extension jars for the Docker build context
        run: |
          mkdir -p docker-libs/extensions enable-iotdb
          cp -v timeseries/service/target/ditto-timeseries-service-0-SNAPSHOT-allinone.jar docker-libs/
          cp -v timeseries/iotdb/target/ditto-timeseries-iotdb-0-SNAPSHOT-extension.jar docker-libs/extensions/
          echo 'include required(classpath("ditto-timeseries-iotdb.conf"))' > enable-iotdb/timeseries-extension.conf
          jar cf docker-libs/extensions/ditto-timeseries-iotdb-enable.jar -C enable-iotdb .
          cp dockerfile-release docker-libs/Dockerfile
          echo 'COPY --chown=ditto:ditto extensions/ $DITTO_HOME/extensions/' >> docker-libs/Dockerfile
          ls -lhR docker-libs
      -
        name: Build and push ditto-timeseries with the IoTDB extension
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-libs
          file: docker-libs/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-timeseries-service
            SERVICE_VERSION=0-SNAPSHOT
            MAIN_CLASS=org.eclipse.ditto.timeseries.service.starter.TimeseriesService
          pull: true
          push: true
          tags: |
            eclipse/ditto-timeseries:${{ env.IMAGE_TAG }}
