name: push-dockerhub

on:
  push:
    tags:
      - '**'
      # The helm-chart-<version> tags release the Helm chart, not the services. Without this
      # exclusion they trigger a full 5-service build here and push service images tagged
      # with the chart version (e.g. eclipse/ditto-things:helm-chart-4.6.0).
      - '!helm-chart**'
  # Allow manually (re-)running the image build for an already-pushed release, e.g. to
  # recover a release whose artifact publishing failed. Dispatch this workflow from the
  # branch that contains the up-to-date build logic (e.g. master) and set 'dittoVersion' to
  # the release tag: the matching tag is checked out and its sources are built, while the
  # current workflow definition is used.
  workflow_dispatch:
    inputs:
      dittoVersion:
        description: 'Release tag to (re-)build images for (e.g. 3.9.5). Leave empty on tag pushes.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a tag push this resolves to the pushed tag; on manual dispatch it checks out
          # the tag given via the 'dittoVersion' input so the built sources match the version.
          ref: ${{ inputs.dittoVersion || github.ref }}
          # full history incl. tags: needed to decide whether this release is the newest
          # one (see "Determine image tags" below)
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.1.0 # setup buildx in order to do build and push multi-architecture images
      -
        name: Inspect buildx builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
      -
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: eclipsedittobot
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      -
        name: Branch name
        id: branch_name
        env:
          DITTO_VERSION_INPUT: ${{ inputs.dittoVersion }}
        run: |
          # Use the manually supplied version when dispatched, otherwise the pushed tag.
          TAG="${DITTO_VERSION_INPUT:-${GITHUB_REF#refs/tags/}}"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_MINOR_TAG=$(echo "$TAG" | cut -d. -f-2)" >> $GITHUB_ENV
          echo "IMAGE_MAJOR_TAG=$(echo "$TAG" | cut -d. -f-1)" >> $GITHUB_ENV
          echo "MILESTONE_OR_RC_SUFFIX=$(echo "$TAG" | cut -d- -f2)" >> $GITHUB_ENV
      -
        name: Building Docker images for tag
        run: |
          echo $IMAGE_TAG
          echo "Full version: $IMAGE_TAG"
          echo "Minor version: $IMAGE_MINOR_TAG"
          echo "Major version: $IMAGE_MAJOR_TAG"
          echo "Milestone or RC suffix: $MILESTONE_OR_RC_SUFFIX"
      -
        name: Determine image tags
        run: |
          # X.Y.Z and X.Y always move with the release being built. The floating `X` and
          # `latest` tags must NOT: a patch release of an older line (e.g. 3.8.13 published
          # after 3.9.7) would otherwise steal them from the newer line.
          finals() { git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; }
          NEWEST_OVERALL="$(finals | sort -V | tail -1)"
          NEWEST_IN_MAJOR="$(finals | grep -E "^${IMAGE_MAJOR_TAG}\." | sort -V | tail -1)"
          if [ -z "$NEWEST_OVERALL" ]; then
            echo "::error::no release tags found - refusing to guess which tags to move"
            exit 1
          fi
          echo "Newest overall: $NEWEST_OVERALL"
          echo "Newest in major $IMAGE_MAJOR_TAG: $NEWEST_IN_MAJOR"
          for img in ditto-policies ditto-things ditto-gateway ditto-things-search \
                     ditto-connectivity ditto-ui; do
            var="TAGS_$(echo "$img" | tr 'a-z-' 'A-Z_')"
            {
              echo "${var}<<__TAGS_EOF__"
              echo "eclipse/${img}:${IMAGE_TAG}"
              echo "eclipse/${img}:${IMAGE_MINOR_TAG}"
              if [ "$IMAGE_TAG" = "$NEWEST_IN_MAJOR" ]; then
                echo "eclipse/${img}:${IMAGE_MAJOR_TAG}"
              fi
              if [ "$IMAGE_TAG" = "$NEWEST_OVERALL" ]; then
                echo "eclipse/${img}:latest"
              fi
              echo "__TAGS_EOF__"
            } >> $GITHUB_ENV
          done
      -
        name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      -
        name: Build allinone jars from sources
        # The *-allinone.jar artifacts are no longer published to a Maven repository (they
        # exceed the repo.eclipse.org upload size limit). Build them here from the tagged
        # sources so the Docker image build can consume them from the local context.
        run: |
          mvn clean install -T4 --batch-mode --errors -DskipTests -Dmaven.javadoc.skip=true \
            -Drevision=$IMAGE_TAG \
            -pl policies/service,things/service,gateway/service,connectivity/service,thingsearch/service -am
      -
        name: Stage allinone jars for the Docker build context
        run: |
          mkdir -p docker-libs
          find . -path '*/service/target/*-allinone.jar' -exec cp -v {} docker-libs/ \;
          echo "Staged allinone jars:"
          ls -lh docker-libs
      -
        name: Build and push ditto-policies
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-policies-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.policies.service.starter.PoliciesService
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_POLICIES }}
      -
        name: Build and push ditto-things
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-things-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.things.service.starter.ThingsService
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_THINGS }}
      -
        name: Build and push ditto-gateway
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-gateway-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.gateway.service.starter.GatewayService
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_GATEWAY }}
      -
        name: Build and push ditto-thingsearch
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-thingsearch-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.thingsearch.service.starter.SearchService
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_THINGS_SEARCH }}
      -
        name: Build and push ditto-connectivity
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-connectivity-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.connectivity.service.ConnectivityService
            JVM_CMD_ARGS=--add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/sun.security.util=ALL-UNNAMED
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_CONNECTIVITY }}
      -
        name: Use Node.js 18.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      -
        name: Install npm dependencies
        run: npm install
        working-directory: ./ui
      -
        name: Build UI with node
        run: npm run build
        working-directory: ./ui
      -
        name: Build and push ditto-ui
        if: env.MILESTONE_OR_RC_SUFFIX == env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.TAGS_DITTO_UI }}
      -
        name: Build and push ditto-policies milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-policies-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.policies.service.starter.PoliciesService
          pull: true
          push: true
          tags: |
            eclipse/ditto-policies:${{ env.IMAGE_TAG }}
      -
        name: Build and push ditto-things milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-things-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.things.service.starter.ThingsService
          pull: true
          push: true
          tags: |
            eclipse/ditto-things:${{ env.IMAGE_TAG }}
      -
        name: Build and push ditto-gateway milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-gateway-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.gateway.service.starter.GatewayService
          pull: true
          push: true
          tags: |
            eclipse/ditto-gateway:${{ env.IMAGE_TAG }}
      -
        name: Build and push ditto-thingsearch milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-thingsearch-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.thingsearch.service.starter.SearchService
          pull: true
          push: true
          tags: |
            eclipse/ditto-things-search:${{ env.IMAGE_TAG }}
      -
        name: Build and push ditto-connectivity milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-libs
          file: dockerfile-release
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE_STARTER=ditto-connectivity-service
            SERVICE_VERSION=${{ env.IMAGE_TAG }}
            MAIN_CLASS=org.eclipse.ditto.connectivity.service.ConnectivityService
            JVM_CMD_ARGS=--add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/sun.security.util=ALL-UNNAMED
          pull: true
          push: true
          tags: |
            eclipse/ditto-connectivity:${{ env.IMAGE_TAG }}
      -
        name: Build and push ditto-ui milestone/RC
        if: env.MILESTONE_OR_RC_SUFFIX != env.IMAGE_TAG
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            eclipse/ditto-ui:${{ env.IMAGE_TAG }}
