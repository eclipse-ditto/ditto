# LOCAL-DEV Postgres profile for the Ditto Things service.
#
# Selects the Postgres persistence backend for local development via IntelliJ or the CLI. Injected as the
# highest-priority config layer:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs-path-to-this-file>   (or $PROJECT_DIR$ in IntelliJ)
#
# CLUSTERING: this profile does NOT override pekko.cluster.seed-nodes, so Things joins the Policies-founded
# cluster at 2552 and forms ONE shared cluster with Policies (+ Gateway). Policies self-seeds because its own
# address 2552 is first in policies-dev's seed list. Things is therefore launched alongside Policies (the
# compound `Ditto (Postgres)` run config / run-compound-postgres.sh), or restarted against an already-running
# Policies for the write→restart→recover demo. (The former standalone self-seeding single-node variant was
# removed — a single-service node is not useful on its own.)
#
# Include order (later wins):
#   1. things-dev    — dev HTTP/cluster/seed settings (Mongo backend by default)
#   2. ditto-postgres-persistence — swaps persistence-backend-provider to Postgres, defines per-entity Pekko
#                                   plugin blocks, sets pekko.persistence.*.auto-start-* lists, and supplies the
#                                   ditto.postgresql.* client/pool/SSL defaults; all tuned via POSTGRES_* env
#                                   vars at runtime; not hard-coded here.
#
# The snapshot envelope follows the backend automatically: AbstractPersistenceActor composes the service's
# `ditto.extensions.snapshot-adapter` serializer (the MongoDB default, unchanged) with the Postgres provider's JSONB
# snapshot codec. There is no Postgres-specific snapshot adapter class to configure.
#
# CLASSPATH NOTE: includes MUST use `include classpath("...")`. The FILE_BASED config is parsed with
# ConfigFactory.parseFileAnySyntax(file); a bare `include "..."` is file-relative and silently resolves to
# nothing for classpath resources. The Postgres include is at the TOP LEVEL — ditto-postgres-persistence.conf
# ships top-level Pekko plugin blocks (ditto-postgres-things-journal { }, …); nesting the include inside
# `ditto { }` would misplace them and Pekko would never find them.
# ---------------------------------------------------------------------------------------------------------------------

# 1. Local-dev cluster / HTTP settings.
include classpath("things-dev")

# 2. Postgres persistence backend + R2DBC client/pool/SSL defaults (one file). TOP-LEVEL include.
include classpath("ditto-postgres-persistence")

# Narrows ditto-postgres-persistence.conf's 4-entity default auto-start lists (it now sets
# pekko.persistence.*.auto-start-* itself) to just the Things plugins — required: this service only defines
# its own entity's persistence dispatchers; the profile's 4-entity default would reference missing dispatchers here.
pekko.persistence.journal.auto-start-journals = [ "ditto-postgres-things-journal" ]
pekko.persistence.snapshot-store.auto-start-snapshot-stores = [ "ditto-postgres-things-snapshots" ]

# Placeholder Mongo-collection names so ThingPersistenceOperationsActor can construct.
ditto-postgres-things-journal.overrides {
  journal-collection = "things_journal"
  metadata-collection = "things_metadata"
}
ditto-postgres-things-snapshots.overrides {
  snaps-collection = "things_snaps"
}
