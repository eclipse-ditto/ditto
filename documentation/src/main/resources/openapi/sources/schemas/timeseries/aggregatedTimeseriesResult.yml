type: object
required:
  - results
  - authorization
description: |-
  Cross-Thing aggregation result.

  Unlike the single-thing endpoints (whose body is a bare array), this is an object so it can carry the
  `authorization` summary alongside the series. An aggregate computed over the subset of things you may
  read is indistinguishable from one computed over everything if you only look at the numbers — so the
  exclusion is stated rather than left implicit.
properties:
  authorization:
    type: object
    required:
      - contributingThings
      - excludedThings
      - withheldByPath
      - partial
    description: |-
      How much of the matching data is actually reflected in `results`.
    properties:
      contributingThings:
        type: integer
        description: |-
          How many distinct things shaped these aggregates, i.e. were permitted on at least one
          requested path.
      excludedThings:
        type: integer
        description: |-
          How many things had matching data but were withheld from **every** requested path.

          This is not an error. A namespace-wide `READ_TS` grant is the entry condition for this
          endpoint, but namespace-root policy entries are merged *additively* — an individual thing's
          own policy may still revoke `READ_TS`, and a revoke wins.
      withheldByPath:
        type: object
        additionalProperties:
          type: integer
        description: |-
          Per requested path, how many things had matching data for that path but were withheld from
          it. Only non-zero entries appear.

          `READ_TS` is grantable **per property**, so access is path-granular: a thing denied one
          requested path still contributes to the paths it is entitled to. Such a thing appears here
          under the denied path while remaining counted in `contributingThings` — it is *not* in
          `excludedThings`, which counts only things withheld from every path.

          A thing is counted against a path only if it actually had data for that path, so this never
          inflates with things that would have contributed nothing anyway.
        example:
          /features/circuit/properties/returnTemperature: 1
      partial:
        type: boolean
        description: |-
          `true` when anything at all was withheld, i.e. `withheldByPath` is non-empty. Every affected
          series in `results` is then computed over a subset of the matching data — treat those numbers
          as a lower-bound sample, not the population. Check this before presenting an aggregate as
          representative.
  results:
    type: array
    description: |-
      One entry per `(group, path)` combination.

      There is no `thingId` field — a group generally spans many things. When the query groups by
      `thingId`, the thing ID appears as an ordinary entry inside `group` instead, so every grouping
      choice produces the same response shape.
    items:
      type: object
      required:
        - path
        - result
        - data
      properties:
        group:
          type: object
          additionalProperties:
            type: string
          description: |-
            The group identity: one entry per `groupBy` dimension, keyed by the dimension's name
            (`thingId`, `path`, or the bare tag key for a `tag:<key>` dimension). Absent when the
            query declared no `groupBy`, in which case the entry aggregates every matching thing.

            A point that carries no value for a grouped tag appears under an empty-string value
            rather than being dropped, so the set of keys is the same across all entries.
          example:
            building: 'A'
        path:
          type: string
          description: |-
            The Ditto Protocol path this series belongs to, e.g.
            `/features/circuit/properties/flowTemperature`. Results are always reported per path.
        result:
          type: object
          required:
            - count
            - dataType
          properties:
            count:
              type: integer
              description: Number of data points in `data`.
            unit:
              type: string
              description: |-
                The unit declared on the WoT property, when the points of this series carry one.
              example: 'cel'
            dataType:
              type: string
              description: JSON type of the aggregated values.
              example: 'number'
            tags:
              type: object
              additionalProperties:
                type: string
              description: |-
                Always empty for aggregated results: a group spans many points whose tags may differ,
                so there is no single tag set to report. Use `group` instead.
        data:
          type: array
          description: |-
            The aggregated values in chronological order, one per `step` bucket that has data (plus
            the interpolated buckets when `fill` is set).
          items:
            type: object
            required:
              - t
              - v
            properties:
              t:
                type: string
                format: date-time
                description: |-
                  Start of the bucket, ISO-8601. Rendered as epoch milliseconds instead when
                  `timeFormat=ms`.
              v:
                description: The aggregated value for this bucket. Type matches `dataType`.
              _gap:
                type: boolean
                description: |-
                  Present and `true` when this bucket had no data of its own and was synthesised by the
                  `fill` strategy. Absent on buckets backed by real measurements.
