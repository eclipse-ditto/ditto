# LOCAL-DEV Postgres profile for the Ditto Connectivity service.
#
# Selects the Postgres persistence backend for local development. Injected as the highest-priority
# config layer:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs-path-to-this-file>   (or $PROJECT_DIR$ in IntelliJ)
#
# Include order (later wins):
#   1. connectivity-dev          — dev HTTP/cluster/seed settings (Mongo backend by default)
#   2. ditto-postgres-persistence — swaps persistence-backend-provider to Postgres, defines per-entity
#                                   Pekko plugin blocks, sets pekko.persistence.*.auto-start-* lists, and
#                                   supplies the ditto.postgresql.* client/pool/SSL defaults (URI/pool/SSL);
#                                   all tuned via POSTGRES_* env vars at runtime; not hard-coded here.
#
# Connectivity joins the cluster at 2552 (Policies is cluster founder) — no seed-nodes override needed.
#
# DDATA for remember-entities: connectivity.conf defaults remember-entities-store to "eventsourced",
# which uses the `pekko-contrib-mongodb-persistence-connection-remember-*` Mongo journals for shard
# state. With Postgres there is no Mongo; switching to "ddata" stores shard membership in the Pekko
# cluster gossip (distributed data), which requires no persistence plugin. This means a cluster restart
# will re-discover connections rather than restore from the remember-entities journal — acceptable for
# local development and consistent with the D2 design decision. ditto-postgres-persistence.conf now sets
# this itself; the override below is kept as belt-and-braces (see its comment further down).
#
# See things-pg-dev.conf for the full classpath and top-level include rationale.
# The snapshot envelope follows the backend automatically (keep the default `ditto.extensions.snapshot-adapter`).
# ---------------------------------------------------------------------------------------------------------------------

# 1. Local-dev cluster / HTTP settings.
include classpath("connectivity-dev")

# 2. Postgres persistence backend + R2DBC client/pool/SSL defaults (one file). TOP-LEVEL include.
include classpath("ditto-postgres-persistence")

# Redundant with ditto-postgres-persistence.conf (which now sets ddata itself); kept as belt-and-braces
# for overlays that include this file without the profile.
pekko.cluster.sharding.remember-entities-store = "ddata"

# Narrows ditto-postgres-persistence.conf's 4-entity default auto-start lists (it now sets
# pekko.persistence.*.auto-start-* itself) to just the Connections plugins — required: this service only defines
# its own entity's persistence dispatchers; the profile's 4-entity default would reference missing dispatchers here.
pekko.persistence.journal.auto-start-journals = [ "ditto-postgres-connections-journal" ]
pekko.persistence.snapshot-store.auto-start-snapshot-stores = [ "ditto-postgres-connections-snapshots" ]

# Placeholder Mongo-collection names so ConnectionPersistenceOperationsActor can construct.
ditto-postgres-connections-journal.overrides {
  journal-collection = "connections_journal"
  metadata-collection = "connections_metadata"
}
ditto-postgres-connections-snapshots.overrides {
  snaps-collection = "connections_snaps"
}
