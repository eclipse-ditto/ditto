{{- if and .Values.postgres.tls.enabled (not .Values.postgres.tls.existingSecret) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ditto.fullname" . }}-postgres-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "ditto.name" . }}-postgres-tls
{{ include "ditto.labels" . | indent 4 }}
type: Opaque
data:
  # ca.crt -> the ditto.postgresql.ssl.root-cert path (r2dbc "sslRootCert").
  #  May be a multi-CA PEM bundle for staged CA rotation.
  ca.crt: {{ required "postgres.tls.caCert (or postgres.tls.existingSecret) is required when postgres.tls.enabled" .Values.postgres.tls.caCert | b64enc | quote }}
  {{- if .Values.postgres.tls.mTLS.enabled }}
  # tls.crt -> ssl.cert (r2dbc "sslCert"); tls.key (PKCS#8) -> ssl.key (r2dbc "sslKey").
  tls.crt: {{ required "postgres.tls.mTLS.clientCert is required when mTLS is enabled" .Values.postgres.tls.mTLS.clientCert | b64enc | quote }}
  tls.key: {{ required "postgres.tls.mTLS.clientKey (PKCS#8) is required when mTLS is enabled" .Values.postgres.tls.mTLS.clientKey | b64enc | quote }}
  {{- end }}
{{- end }}
