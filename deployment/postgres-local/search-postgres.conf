# LOCAL-DEV Postgres overlay for the Ditto Things-Search service (CLI launch).
#
# Injected as the highest-priority (FILE_BASED) config layer:
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs path to this file>
#
# CLI TWIN: this overlay is the run-compound-postgres.sh (CLI) twin of the IntelliJ-run-config profile
# thingsearch/service/src/main/resources/search-pg-dev.conf — same two includes, same rationale. Keep both in sync.
#
# CLUSTERING: search-dev already seeds on ditto-cluster at 2552 (Policies is the founding seed; search's own
# artery port is 2557), so no seed-node override is needed — launch alongside the compound in any order; the
# service retries the seed until Policies is up.
#
# Include order (later wins):
#   1. search-dev             — dev HTTP/cluster/seed settings (Mongo search backend by default)
#   2. ditto-postgres-search  — swaps ditto.extensions.search-persistence-provider to the PostgreSQL provider
#                               and pulls in the shared ditto.postgresql.* client/pool/SSL defaults
#                               (single include, opt-in by design — see that file's header).
#
# CLASSPATH NOTE (same as the sibling overlays): includes MUST use `include classpath("...")` — the FILE_BASED
# config is parsed with parseFileAnySyntax, where a bare include is file-relative and silently resolves to
# nothing. Both includes are TOP LEVEL.
#
# CLASSPATH REQUIREMENT: the search-r2dbc module jar and its runtime deps (postgres-client, r2dbc-postgresql,
# r2dbc-pool, reactor-core 3.5.x) must be prepended BEFORE the thingsearch allinone jar — see
# run-compound-postgres.sh (equivalent to mounting base + search extension JARs in /opt/ditto/extensions/).
# ---------------------------------------------------------------------------------------------------------------------

# 1. Local-dev cluster / HTTP settings (Mongo backend by default).
include classpath("search-dev")

# 2. Opt-in PostgreSQL search backend + shared R2DBC client/pool/SSL defaults. TOP-LEVEL include.
include classpath("ditto-postgres-search")
