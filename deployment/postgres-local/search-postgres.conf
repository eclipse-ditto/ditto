# LOCAL-DEV Postgres overlay for the Ditto Things-Search service (CLI launch).
#
# Injected as the highest-priority (FILE_BASED) config layer:
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs path to this file>
#
# The PostgreSQL search backend needs no include here: search.conf's fixed-name `ditto-search-backend` include
# resolves to the PostgreSQL search profile because run-compound-postgres.sh puts the search-r2dbc JAR first on
# the classpath, as the IntelliJ `SearchService (Postgres)` run config does through ide-postgres-launcher.
#
# CLUSTERING: search-dev already seeds on ditto-cluster at 2552 (Policies is the founding seed; search's own
# artery port is 2557), so no seed-node override is needed — launch alongside the compound in any order; the
# service retries the seed until Policies is up.
#
# This overlay includes only search-dev (dev HTTP/cluster/seed settings). The search backend profile
# (ditto-postgres-search: the PostgreSQL provider plus the shared ditto.postgresql.* client/pool/SSL defaults) arrives
# through search.conf's `ditto-search-backend` include.
#
# CLASSPATH NOTE (same as the sibling overlays): includes MUST use `include classpath("...")` — the FILE_BASED
# config is parsed with parseFileAnySyntax, where a bare include is file-relative and silently resolves to
# nothing. The include is TOP LEVEL.
#
# CLASSPATH REQUIREMENT: the staged PostgreSQL backend folder of the thingsearch service (stage-backends.sh:
# base + search extension JARs, the image's /opt/ditto/backends/postgresql/) must be on the classpath next to the
# thingsearch allinone jar — see run-compound-postgres.sh.
# ---------------------------------------------------------------------------------------------------------------------

# Local-dev cluster / HTTP settings.
include classpath("search-dev")
