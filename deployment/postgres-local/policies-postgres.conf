# ---------------------------------------------------------------------------------------------------------------------
# LOCAL Postgres OVERLAY for the Ditto Policies service.
#
# The authoritative local-dev Postgres profile lives in the service classpath:
#   policies/service/src/main/resources/policies-pg-dev.conf
#
# This file is kept for docker-compose / CLI runs that set HOSTING_ENVIRONMENT_FILE_LOCATION to an
# absolute path (e.g. run-compound-postgres.sh). It delegates to the classpath resource so there
# is ONE source of truth.
#
# Policies self-seeds at 2552 (cluster founder) for the compound run (run-compound-postgres.sh / Ditto (Postgres)).
# ---------------------------------------------------------------------------------------------------------------------

# Delegate entirely to the classpath resource that is the single source of truth.
include classpath("policies-pg-dev")
