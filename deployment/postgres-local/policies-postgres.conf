# ---------------------------------------------------------------------------------------------------------------------
# LOCAL Postgres OVERLAY for the Ditto Policies service.
#
# This file is for docker-compose / CLI runs that set HOSTING_ENVIRONMENT_FILE_LOCATION to an
# absolute path (e.g. run-compound-postgres.sh). It only layers the dev settings (policies-dev). The PostgreSQL
# backend comes from the PostgreSQL JARs the script puts first on the classpath: policies.conf's fixed-name
# `ditto-persistence-backend` include then resolves to the PostgreSQL persistence profile.
#
# Policies self-seeds at 2552 (cluster founder) for the compound run (run-compound-postgres.sh / Ditto (Postgres)).
# ---------------------------------------------------------------------------------------------------------------------

# Local-dev cluster / HTTP settings.
include classpath("policies-dev")
