# ---------------------------------------------------------------------------------------------------------------------
# LOCAL Postgres OVERLAY for the Ditto Connectivity service (CLI runs).
#
# Set as HOSTING_ENVIRONMENT_FILE_LOCATION by run-compound-postgres.sh. It only layers the dev settings
# (connectivity-dev). The PostgreSQL backend comes from the PostgreSQL JARs the script puts first on the classpath:
# connectivity.conf's fixed-name `ditto-persistence-backend` include then resolves to the PostgreSQL persistence
# profile. Connectivity joins the Policies-founded cluster at 2552 (no seed-nodes override).
#
# Connection params (POSTGRES_URI / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_SSL_MODE) are
# supplied via ENV — see run-compound-postgres.sh.
# ---------------------------------------------------------------------------------------------------------------------

# Local-dev cluster / HTTP settings.
include classpath("connectivity-dev")
