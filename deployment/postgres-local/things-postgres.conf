# ---------------------------------------------------------------------------------------------------------------------
# LOCAL Postgres OVERLAY for the Ditto Things service (CLI / docker-compose runs).
#
# Superseded by the pluggable-persistence design (C3/Task-F). The authoritative local-dev Postgres
# profile now lives in the service classpath:
#   things/service/src/main/resources/things-pg-dev.conf
#
# This file is kept for CLI runs that set HOSTING_ENVIRONMENT_FILE_LOCATION to an absolute path
# (e.g. run-compound-postgres.sh). It simply delegates to the classpath resource so there is ONE source
# of truth — all include logic and pekko overrides are in things-pg-dev.conf.
# Things joins the Policies-founded cluster at 2552 (no seed-nodes override), so launch it alongside
# Policies (run-compound-postgres.sh) or restart it against an already-running Policies.
#
# NO snapshot-adapter override: AbstractPersistenceActor composes the default `ditto.extensions.snapshot-adapter`
# serializer with the Postgres provider's JSONB snapshot codec automatically (the per-backend adapter classes are
# gone; the key and its MongoDB default are unchanged). Do NOT add one here.
#
# Connection params (POSTGRES_URI / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_SSL_MODE) are
# supplied via ENV — see run-compound-postgres.sh and docker-compose.postgres.yml.
# ---------------------------------------------------------------------------------------------------------------------

# Delegate entirely to the classpath resource that is the single source of truth.
include classpath("things-pg-dev")
