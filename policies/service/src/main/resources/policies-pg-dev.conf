# ---------------------------------------------------------------------------------------------------------------------
# LOCAL-DEV Postgres profile for the Ditto Policies service.
#
# Selects the Postgres persistence backend for local development. Injected as the highest-priority
# config layer:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=<abs-path-to-this-file>   (or $PROJECT_DIR$ in IntelliJ)
#
# Include order (later wins):
#   1. policies-dev              — dev HTTP/cluster/seed settings (Mongo backend by default)
#   2. ditto-postgres-persistence — swaps persistence-backend-provider to Postgres, defines per-entity
#                                   Pekko plugin blocks, sets pekko.persistence.*.auto-start-* lists, and
#                                   supplies the ditto.postgresql.* client/pool/SSL defaults (URI/pool/SSL);
#                                   all tuned via POSTGRES_* env vars at runtime; not hard-coded here.
#
# Policies is the cluster FOUNDER in the dev seed list (its own address 2552 is first), so it
# self-seeds with the normal policies-dev seed list — no seed-nodes override needed. This conf is
# used for both standalone Policies and the compound (Policies + Things + Gateway) run.
#
# See things-pg-dev.conf for the full classpath and top-level include rationale.
# The snapshot envelope follows the backend automatically (keep the default `ditto.extensions.snapshot-adapter`).
# ---------------------------------------------------------------------------------------------------------------------

# 1. Local-dev cluster / HTTP settings.
include classpath("policies-dev")

# 2. Postgres persistence backend + R2DBC client/pool/SSL defaults (one file). TOP-LEVEL include.
include classpath("ditto-postgres-persistence")

# Narrows ditto-postgres-persistence.conf's 4-entity default auto-start lists (it now sets
# pekko.persistence.*.auto-start-* itself) to just the Policies plugins — required: this service only defines
# its own entity's persistence dispatchers; the profile's 4-entity default would reference missing dispatchers here.
pekko.persistence.journal.auto-start-journals = [ "ditto-postgres-policies-journal" ]
pekko.persistence.snapshot-store.auto-start-snapshot-stores = [ "ditto-postgres-policies-snapshots" ]
